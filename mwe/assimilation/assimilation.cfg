&da_settings
    logger%verbose_level = 0

    output%result_file_name_tag = "assimilation"
    !
    ! the following fields are written
    output%saved_fields = 'DEN' , 'O1', 'O2', 'HE', 'TN', 'NE'
    ! save all fields that are part of the state vector
    output%save_state = .true.
    output%save_state_nm = .false.
    output%save_unconstrained_analysis = .false.
    ! save all fields that are observed
    output%save_obs = .true.
    !
    output%save_members = .true.
    output%max_moment = 1
    output%supress_tiegcm_output = .true.
    !
    output%sync_every = 20
    output%output_strategy = 1
    output%use_double_precision = .false.

    output%write_every_sec = 1800
    output%force_write_on_update = .false.
    output%lock_nc_time = .false.
!-----------------------------------------------------------------------------------------
    calibration%apply = .false.
!-----------------------------------------------------------------------------------------
    parameters%ensemble_file = "../../data/perturbations_mwe_2010.nc"
    parameters%f107%handling = 'perturb'
    parameters%ctpoten%handling = 'perturb'
    parameters%hspower%handling = 'perturb'
    parameters%tlbc%handling = 'perturb'
    parameters%zlbc%handling = 'perturb'
    parameters%ulbc%handling = 'perturb'
    parameters%vlbc%handling = 'perturb'
    parameters%alfac%handling = 'perturb'
    parameters%alfad%handling = 'perturb'
    parameters%colfac%handling = 'perturb'
    parameters%joulefac%handling = 'perturb'
    parameters%swden%handling = 'none'
    parameters%swvel%handling = 'none'
    parameters%imfbx%handling = 'none'
    parameters%imfby%handling = 'none'
    parameters%imfbz%handling = 'none'
    parameters%igrf_sh%handling = 'perturb'
    parameters%co2u%handling = 'mean'
!-----------------------------------------------------------------------------------------
! size of ensemble
    ensemble%ensemble_size =2
! if true the ensemble is initialized with values of first state vector (read from primary file)
    ensemble%overwrite_source = .true.
! use  source file created by open loop with ens_xxxx name schema
    ensemble%source_path = '../../ensemble_initalization/results'
    ensemble%source_name = 'ensemble_init_prim.nc'
!--------------------------------------------------------------------------------------------------
! If true assimilation step is not perforemd. Settings in group 'assimilation' are not read
    filter%open_loop = .false.
    filter%spline_degree = 3
! this group contains pdaf settings
    ! 1.5h -> 5400  sec
    filter%first_analysis_step_sec = 60
! seconds between analysis steps
    ! 3h -> 10800 sec
    filter%forecast_duration_sec = 60
! 2:EnKF 4:ETKF 6: ESTKF 7:LESTKF
    filter%filtertype = 6
    filter%subtype = 0
    filter%type_trans = 0
    filter%type_forget = 0
    filter%forget = 1.0
    filter%type_sqrt = 1
    filter%rank_analysis_enkf = 0
    filter%cutoff_radius = 1000E+3,1000E+3,50E+3
    filter%support_radius = 1000E+3,1000E+3,50E+3
! locweight
! 0: unit weight
! 1: exp
! 2: GC
    filter%locweight = 2
! localization_coord_sys
! 1:spherical metric (zonal, meridional, vertical)
! 2:tiegcm cell index (longitude, latitude, vertical)
    filter%localization_coord_sys = 1
    filter%sub_domain_size_vertical = 3
    filter%sub_domain_size_zonal = 3
    filter%sub_domain_size_meridional = 3

!--------------------------------------------------------------------------------------------------

! assimilated tie-gcm fields that are included in state vector
    state%O2 = .true.
    state%O1 = .true.
    state%HE = .true.
    state%TN = .true.
    state%NE = .false.
    state%atomic_oxygen_ion_density = .false.
    state%molecular_oxygen_ion_density = .false.

!--------------------------------------------------------------------------------------------------


  observation%satellite(1)%apply = .true.
  observation%satellite(1)%always_save = .true.
  observation%satellite(1)%file = "../../data/champ_denswind_v3_4_2010-04.nc"
  observation%satellite(1)%name = "champ"
  observation%satellite(1)%weight = 1.
  observation%satellite(1)%write_every_sec = 60

!--------------------------------------------------------------------------------------------------

  logger%verbose_level = 1
/
